  - {cls: Gate_Valve, tag: "", box: [279, 181, 300, 211]}
  - {cls: Gate_Valve, tag: "", box: [386, 229, 418, 258]}
  - {cls: Gate_Valve, tag: "", box: [483, 222, 508, 244]}
  - {cls: Gate_Valve, tag: "", box: [493, 337, 525, 365]}
