  - {cls: Gate_Valve, tag: "", box: [383, 114, 409, 137]}
  - {cls: Gate_Valve, tag: "", box: [471,  25, 498,  47]}
  - {cls: Gate_Valve, tag: "", box: [503, 106, 527, 140]}
